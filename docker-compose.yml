services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pym
      POSTGRES_PASSWORD: pym
      POSTGRES_DB: pym
    ports:
      - "5432:5432"
    volumes:
      - pym-pgdata:/var/lib/postgresql/18/docker
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pym-pgdata:
