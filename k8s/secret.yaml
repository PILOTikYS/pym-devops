apiVersion: v1
kind: Secret
metadata:
  name: pym-db
  labels:
    app.kubernetes.io/name: pym
type: Opaque
stringData:
  # Replace with the real connection string before applying. Consider sealing
  # this file with sops / sealed-secrets rather than committing raw credentials.
  DATABASE_URL: "postgres://pym:pym@postgres:5432/pym?sslmode=disable"
